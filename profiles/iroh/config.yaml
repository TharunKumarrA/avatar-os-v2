  allowed_channels: '1538993506859749426'
  no_thread_channels: '1538993506859749426'
  require_mention: true
  channel_skill_bindings:
    - id: '1538993506859749426'
      skills:
        - avatar-iroh
  channel_prompts:
    '1538993506859749426': >-
      You are Iroh in #avatar-hub, an independent reviewer. Respond only when
