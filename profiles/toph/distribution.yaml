name: avatar-toph
version: 2.0.0
description: "Independent GATE CSE tutor with Shared Context v2 handoffs"
hermes_requires: ">=0.20.6"
author: "Tharun"
license: "Proprietary"
distribution_owned:
  - SOUL.md
  - config.yaml
  - profile.yaml
  - skills/
env_requires:
  - name: DISCORD_BOT_TOKEN
    description: "Toph Discord bot token"
    required: true
  - name: DISCORD_ALLOWED_USERS
    description: "Comma-separated Discord user IDs allowed to use Toph"
    required: true
  - name: DISCORD_HOME_CHANNEL
    description: "Discord channel ID for gateway lifecycle notices"
    required: true

