name: avatar-katara
version: 2.1.0
description: "Katara navigator and Shared Context v2 coordinator for Avatar OS"
hermes_requires: ">=0.20.6"
author: "Tharun"
license: "Proprietary"
distribution_owned:
  - SOUL.md
  - config.yaml
  - profile.yaml
  - skills/
  - cron/
env_requires:
  - name: DISCORD_BOT_TOKEN
    description: "Katara Discord bot token"
    required: true
  - name: DISCORD_ALLOWED_USERS
    description: "Comma-separated Discord user IDs allowed to use Katara"
    required: true
  - name: DISCORD_HOME_CHANNEL
    description: "Discord channel ID for gateway lifecycle notices"
    required: true
